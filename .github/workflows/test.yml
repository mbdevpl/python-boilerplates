name: test

on:
  push:

permissions:
  contents: read

jobs:
  test-build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install build~=1.2
      - run: python -m build
  test-unittest:
    name: unittest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_ci.txt
      - run: python -m coverage run --branch --source . --omit "boilerplates/bundled_version_query/*" -m build
      - run: python -m coverage run --append --branch --source . --omit "boilerplates/bundled_version_query/*" -m unittest -v
      - run: python -m coverage report --show-missing
      - run: python -m codecov --token ${{ secrets.CODECOV_TOKEN }}
