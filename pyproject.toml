[project]
name = 'boilerplates'
requires-python = '>=3.11,<4'
keywords = ['git', 'logging', 'packaging', 'releasing']
dependencies = []
dynamic = ['authors', 'classifiers', 'description', 'license', 'maintainers', 'optional-dependencies', 'readme', 'version']

[dependency-groups]
coverage = [
    {include-group = 'test'},
    'codecov~=2.1',
    'coverage~=7.2'
]
flake518 = [
    'flake518~=1.6'
]
mypy = [
    'mypy~=2.4',
    'types-docutils~=0.20',
    'types-setuptools>=70.0'
]
publish = [
    'build~=1.6',
    'twine~=7.0'
]
pydocstyle = [
    'pydocstyle~=6.3'
]
pylint = [
    'pylint~=4.1'
]
test = [
    'argcomplete~=3.7',
    'build~=1.2',
    'colorlog~=6.7',
    'docutils~=0.20',
    'GitPython~=3.1',
    'pip>=24.0',
    'Pygments~=2.14',
    'sentry-sdk[pure_eval]~=2.5',
    'setuptools>=77.0.3',
    'version-query~=1.8',
    'wheel>=0.43'
]

[build-system]
build-backend = 'setuptools.build_meta'
requires = [
    'docutils~=0.23',
    'GitPython~=3.1',
    'packaging~=26.3',
    'Pygments~=2.21',
    'semver~=3.0',
    'setuptools>=79.0'
]

[tool.flake8]
max-line-length = 100
max-doc-length = 100

[[tool.mypy.overrides]]
module = [
    'sentry_sdk',
    'sentry_sdk.integrations.*'
]
ignore_missing_imports = true

[tool.pydocstyle]
ignore = [
    'D102', 'D103', 'D105', 'D107',
    'D203', 'D213',
    'D406', 'D407', 'D412', 'D413'
]

[tool.pylint.MASTER]
load-plugins = [
    'pylint.extensions.broad_try_clause',
    'pylint.extensions.mccabe',
    'pylint.extensions.no_self_use',
    'pylint.extensions.redefined_variable_type'
]

[tool.pylint.'MESSAGES CONTROL']
docstring-min-length = 5

[tool.pylint.SIMILARITIES]
ignore-imports = 'yes'
min-similarity-lines = 5

[tool.pylint.BASIC]
no-docstring-rgx = '^(test)?_|.*Tests$'
unsafe-load-any-extension = 'yes'

[tool.pylint.REPORTS]
output-format = 'colorized'
